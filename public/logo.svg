<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Droplet silhouette clip -->
    <clipPath id="hydroDropClip">
      <path d="M 239 56 Q 256 35 273 56 C 324 120 420 232 420 316 C 420 405 347 474 256 474 C 165 474 92 405 92 316 C 92 232 188 120 239 56 Z" />
    </clipPath>

    <!-- Upper droplet diagonal gradient (bright cyan top-left to deep navy right) -->
    <linearGradient id="hydroBodyGrad" x1="115" y1="110" x2="405" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#19B5FF" />
      <stop offset="42%" stop-color="#0A82ED" />
      <stop offset="78%" stop-color="#0549A8" />
      <stop offset="100%" stop-color="#033184" />
    </linearGradient>

    <!-- Lower wave gradient (icy cyan crest on left to rich azure at bottom-right) -->
    <linearGradient id="hydroWaveGrad" x1="135" y1="320" x2="375" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6ECFF" />
      <stop offset="24%" stop-color="#38C0FF" />
      <stop offset="62%" stop-color="#0B93F6" />
      <stop offset="100%" stop-color="#005FD4" />
    </linearGradient>

    <!-- Soft radial highlight on left wave crest -->
    <radialGradient id="hydroCrestGlow" cx="165" cy="338" r="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C8F4FF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38C0FF" stop-opacity="0" />
    </radialGradient>

    <!-- Bar chart vertical gradient (white top to soft ice blue bottom) -->
    <linearGradient id="hydroBarGrad" x1="0" y1="178" x2="0" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#EBF6FF" />
      <stop offset="100%" stop-color="#C2E2FF" />
    </linearGradient>
  </defs>

  <g clip-path="url(#hydroDropClip)">
    <!-- Main Droplet Body -->
    <rect x="80" y="30" width="352" height="452" fill="url(#hydroBodyGrad)" />

    <!-- Three Ascending Rounded Chart Bars -->
    <rect x="198" y="252" width="40" height="52" rx="13" fill="url(#hydroBarGrad)" />
    <rect x="254" y="216" width="40" height="88" rx="13" fill="url(#hydroBarGrad)" />
    <rect x="310" y="178" width="40" height="126" rx="13" fill="url(#hydroBarGrad)" />

    <!-- Foreground Wave -->
    <path
      d="M 92 374 C 128 320 180 306 238 334 C 298 363 368 356 418 268 L 432 486 L 80 486 Z"
      fill="url(#hydroWaveGrad)"
    />
    <path
      d="M 92 374 C 128 320 180 306 238 334 C 298 363 368 356 418 268 L 432 486 L 80 486 Z"
      fill="url(#hydroCrestGlow)"
    />
  </g>
</svg>
